plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

def mc = (project.findProperty('mc') ?: '26.2').toString()
def mcDep = (project.findProperty('mc_dep') ?: "~${mc}").toString()
def javaRelease = (project.findProperty('java_release') ?: '25').toString()
def legacy = project.hasProperty('legacy')

repositories {
	maven {
		name = "TerraformersMC"
		url = "https://maven.terraformersmc.com/releases/"
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"m0_1g" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

if (legacy) {
	sourceSets.client.java.setSrcDirs(['src/legacy/client/java'])
	sourceSets.client.resources.setSrcDirs(['src/legacy/client/resources'])
	sourceSets.main.java.setSrcDirs(['src/legacy/main/java'])
	sourceSets.main.resources.setSrcDirs(['src/legacy/main/resources'])
}

dependencies {
	if (legacy) {
		mappings "net.fabricmc:yarn:${project.findProperty('yarn_mappings')}:v2"
	}
	minecraft "com.mojang:minecraft:${mc}"
	implementation "net.fabricmc:fabric-loader:${loader_version}"

	// Optional: Mod Menu config integration (compile-time only, never bundled).
	compileOnly "com.terraformersmc:modmenu:${project.findProperty('modmenu_version') ?: '21.0.0'}"
}

def modVersion = project.version.toString()

processResources {
	inputs.property "version", modVersion
	inputs.property "mc_dep", mcDep

	filesMatching("fabric.mod.json") {
		expand "version": modVersion, "mc_dep": mcDep
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = javaRelease.toInteger()
}

base {
	archivesName = "Multiplayer Grid ${mc}"
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.toVersion(javaRelease)
	targetCompatibility = JavaVersion.toVersion(javaRelease)
}
